version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @types/node follows the oldest Node the package supports (engines), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is blocked on its tooling, not on this code: typescript-eslint and ts-jest
      # both cap their typescript peer below 7 (checked 2026-09-27). Lift this when they don't.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
